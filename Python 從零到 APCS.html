[0,"print 與變數","程式是一行一行由上往下執行。<code>print()</code> 顯示結果，<code>=</code> 把值存進變數。變數名稱可用英文、數字、底線，但不能以數字開頭。","name = \"小明\"\nage = 16\nprint(\"Hi\", name)\nprint(age + 1)","執行 x = 5 再 x = x + 2 後，x 是多少？",["5","7","52"],1,"x + 2 以舊值 5 計算，結果 7 再存回 x。"],

[2,"遞迴","函式呼叫自己。必須有<b>終止條件</b>，並讓問題每次變小。","def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\n\ndef fib(n):\n    return n if n < 2 else fib(n-1) + fib(n-2)\nprint(fact(5), fib(10))","遞迴少了終止條件會怎樣？",["自動停止","一直呼叫直到 RecursionError","回傳 0"],1,"Python 預設遞迴深度約 1000 層。"],
[2,"排序與二分搜尋","<code>sorted()</code> 與 <code>list.sort()</code> 都是 O(n log n)。資料已排序時，二分搜尋每次砍掉一半，只要 O(log n)。","def bsearch(a, x):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == x: return mid\n        if a[mid] < x: lo = mid + 1\n        else: hi = mid - 1\n    return -1\nprint(bsearch([1,3,5,7,9], 7))","二分搜尋的前提是？",["資料已排序","資料都是整數","資料不重複"],0,"沒有排序就無法判斷該丟掉哪一半。"],

[2,"stack 與 queue","stack 後進先出（用 list 的 append / pop）；queue 先進先出，請用 <code>collections.deque</code>，因為 list.pop(0) 是 O(n)。","from collections import deque\nst = []; st.append(1); st.append(2); print(st.pop())  # 2\nq = deque([1, 2]); q.append(3); print(q.popleft())  # 1","括號配對檢查適合用哪種結構？",["stack","queue","set"],0,"最後出現的左括號要最先被配對。"],
[3,"APCS 題型與輸入技巧","APCS 分「觀念題」（讀程式、複雜度、資料結構）與「實作題」（寫完整程式，常見輸入為多行數字）。實作題輸入量大時，改用 <code>sys.stdin</code> 比 input() 快。","import sys\ndata = sys.stdin.read().split()\nn = int(data[0])\na = list(map(int, data[1:n+1]))\nprint(sum(a))","輸入資料很大時，哪種讀法較快？",["每行 input()","sys.stdin.read() 一次讀完","手動逐字元讀"],1,"減少 I/O 呼叫次數，速度差很多。"],

{m:"<h4>判斷寫法與常見錯誤</h4>if 可以巢狀，也可以用 <code>and</code> 合併條件。Python 允許連續比較：<code>0 &lt; x &lt; 10</code>。<b>閏年</b>是經典題：4 的倍數且不是 100 的倍數，或是 400 的倍數。注意 elif 只會執行<b>第一個</b>成立的分支，所以條件順序很重要。",c:"y = int(input())\nif (y % 4 == 0 and y % 100 != 0) or y % 400 == 0:\n    print('閏年')\nelse:\n    print('平年')",q:[["2100 年是閏年嗎？",["是，4 的倍數","不是，100 的倍數但不是 400 的倍數","不一定"],1,"2100 % 100 == 0 且 2100 % 400 != 0。"],["x=5 時，0 < x < 10 的結果是？",["True","False","錯誤"],0,"Python 支援連續比較。"]]},
